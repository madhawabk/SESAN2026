<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Secret Santa 2026</title>
<style>
:root{--teal:#0f4c4a;--teal2:#16706c;--red:#c0392b;--cream:#fbf3e0;--gold:#d9a441;--ink:#23332f;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;color:var(--ink);font-family:"Trebuchet MS",system-ui,sans-serif;background:var(--teal);
  background-image:radial-gradient(rgba(251,243,224,.16) 2px,transparent 3px);background-size:46px 46px;
  padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px))}
.wrap{max-width:480px;margin:0 auto}
h1{color:var(--cream);text-align:center;margin:10px 0 2px;font-size:2rem}
.tag{color:var(--gold);text-align:center;margin:0 0 18px}
.card{background:var(--cream);border-radius:20px;padding:22px;border-top:8px solid var(--gold);box-shadow:0 8px 24px rgba(0,0,0,.28)}
label{display:block;font-weight:700;margin:12px 0 4px}
input,select{width:100%;padding:12px;border-radius:12px;border:2px solid #d8cdb2;background:#fff;font:inherit;color:var(--ink)}
.btn{width:100%;padding:14px;border:0;border-radius:999px;background:var(--red);color:#fff;font:inherit;font-weight:700;font-size:1.05rem;cursor:pointer;margin-top:16px}
.btn.ghost{background:transparent;color:var(--teal);border:2px solid var(--teal)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.err{color:var(--red);font-weight:700;min-height:1.3em;margin:10px 0 0}
.note{color:#6b5f4a;font-size:.88rem;text-align:center;margin:12px 0 0}
.hide{display:none}
.stage{text-align:center;padding:4px 0}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1}
.gift{font-size:4.4rem;text-align:center;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-10px) rotate(4deg)}}
.you{font-weight:700;margin:4px 0 8px;visibility:hidden}
.reel{position:relative;height:168px;overflow:hidden;border-radius:14px;border:3px solid var(--teal);background:#fff}
.reel::before{content:"";position:absolute;left:0;right:0;top:56px;height:56px;background:rgba(217,164,65,.28);border-block:2px solid var(--gold)}
.reel::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(#fff,transparent 34%,transparent 66%,#fff);opacity:.9}
.strip{position:relative;will-change:transform}
.strip div{height:56px;line-height:56px;font:700 1.6rem Georgia,serif;color:var(--teal)}
.strip div.win{color:var(--red);animation:pop .7s cubic-bezier(.2,1.6,.4,1);font-size:1.9rem}
@keyframes pop{0%{transform:scale(.4)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.gift,.strip div.win{animation:none}}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="wrap">
  <h1>🎄 Secret Santa 2026</h1>
  <p class="tag">Find out who you’re gifting to.</p>
  <section class="card">
    <div id="form">
      <div class="gift" aria-hidden="true">🎁</div>
      <label for="name">Your name</label>
      <select id="name"></select>
      <label for="code">Your passcode</label>
      <input id="code" type="password" autocomplete="off" autocapitalize="off" placeholder="Enter your personal passcode">
      <button class="btn" id="go" disabled>Reveal My Secret Santa</button>
    </div>
    <div id="out" class="stage hide">
      <div id="you" class="you">You are the Secret Santa for…</div>
      <div class="reel" aria-live="polite"><div class="strip" id="strip"></div></div>
      <button class="btn ghost hide" id="hide">Hide</button>
    </div>
    <p class="err" id="err" role="alert"></p>
  </section>
  <p class="note">Keep your result to yourself. Come back any time with the same passcode.</p>
</div>
<script>
// Each recipient is stored encrypted (AES-GCM) with a key derived from that person's own passcode.
const DATA = [{"n":"Gayal","s":"1/Ms1UnLTADvkvmUFlq9Ew==","i":"8x4shEBPFvchqRAG","c":"QTSb0+Vw7B7w6hbBxGTTZ9Iz61/yAQ=="},{"n":"Hasini","s":"TFFhvkrWYYnZMp6SsR3gQw==","i":"prte9k62lDkelOj4","c":"fZUNBUchfE34c9oahTyqkZ07Iwim"},{"n":"Lihini","s":"OdCUEzilGWTwfJC/FARjxQ==","i":"k7eagamsRbpUupU2","c":"qQ2A5HhrWEe/QpjE+83piUCtOvk4"},{"n":"Madhawa","s":"v7Rr9CLOHHre0H4ZudVU0A==","i":"6nt7A6Mhc/LJidx9","c":"VJXwnJ5r/tHJxpcSF6/bW57vxga8Lg=="},{"n":"Rukmal","s":"V+0Q4M+AD8Yx4qBRObYZNw==","i":"6QQxNmN1fWL8Yuq8","c":"gcf+UgPTV1n+fKqAr5t698zYpjr664o="},{"n":"Sasiru","s":"zQZxPk0Os0GNvfuczhW9DA==","i":"m72AvsiVxSxYMdx+","c":"KNhIVdmBsdtlxW65kwXDzbFwoKBZiw=="},{"n":"Sikka","s":"YhVQ9JbWRz6RXjgW+87Waw==","i":"eljeOs/bAmXI6Eb4","c":"d5XfNVy6AWkA8REKTzCvwyQrnBeUWQ=="},{"n":"Vishma","s":"TYc9msSzpdEzwX2v6UBElQ==","i":"+dl1pMEtFSEqsmJf","c":"6Y7U4+DcGBAsRDxYAm5Q69fr6a8Ysg=="}];
const $ = id => document.getElementById(id);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function unlock(p, code){
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(code.trim().toLowerCase()), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(p.s), iterations:150000, hash:"SHA-256"}, km, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(p.i)}, key, b64(p.c));
  return new TextDecoder().decode(pt);
}
const sel = $("name");
const first = document.createElement("option"); first.value = ""; first.textContent = "Select your name"; sel.appendChild(first);
DATA.forEach((p, i) => { const o = document.createElement("option"); o.value = i; o.textContent = p.n; sel.appendChild(o); });
const ready = () => { $("go").disabled = !(sel.value !== "" && $("code").value.trim()); };
sel.onchange = ready; $("code").oninput = ready;
$("code").onkeydown = e => { if(e.key === "Enter" && !$("go").disabled) $("go").click(); };

$("go").onclick = async () => {
  $("err").textContent = ""; $("go").disabled = true;
  try{
    if(!window.crypto || !crypto.subtle) throw new Error("secure");
    const r = await unlock(DATA[+sel.value], $("code").value);
    $("form").classList.add("hide"); $("out").classList.remove("hide");
    $("you").style.visibility = "hidden"; $("hide").classList.add("hide");
    spin(r);
  }catch(e){
    $("err").textContent = e.message === "secure" ? "Please open this link in a modern browser over https." : "That passcode isn’t right for this name. Try again.";
    ready();
  }
};
function spin(target){
  const me = DATA[+sel.value].n, pool = DATA.map(p => p.n).filter(n => n !== me);
  const st = $("strip"), N = 36; st.innerHTML = "";
  const add = t => { const d = document.createElement("div"); d.textContent = t; st.appendChild(d); };
  for(let i = 0; i < N; i++) add(pool[Math.floor(Math.random() * pool.length)]);
  add(target); add(pool[0]); add(pool[1]);
  st.style.transition = "none"; st.style.transform = "translateY(0)"; void st.offsetHeight;
  const d = reduce ? 0.3 : 4.6;
  st.style.transition = "transform " + d + "s cubic-bezier(.12,.72,.12,1)";
  st.style.transform = "translateY(" + (-(N - 1) * 56) + "px)";
  setTimeout(() => { $("you").style.visibility = "visible"; $("hide").classList.remove("hide"); st.children[N].classList.add("win"); burst(); }, d * 1000 + 150);
}
$("hide").onclick = () => { $("out").classList.add("hide"); $("form").classList.remove("hide"); $("code").value = ""; $("strip").innerHTML = ""; ready(); };

/* snowfall + confetti */
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const cv = $("fx"), cx = cv.getContext("2d"); let W, H, parts = [];
function size(){ W = cv.width = innerWidth; H = cv.height = innerHeight; }
addEventListener("resize", size); size();
const flake = () => ({x: Math.random() * W, y: Math.random() * H, r: 1 + Math.random() * 3, vy: .4 + Math.random() * 1.2, ph: Math.random() * 6.28});
if(!reduce) for(let i = 0; i < 70; i++) parts.push(flake());
function burst(){
  if(reduce) return; const cols = ["#d9a441","#c0392b","#fbf3e0","#16706c"];
  for(let i = 0; i < 90; i++) parts.push({x: W / 2, y: H / 2.2, vx: (Math.random() - .5) * 10, vy: -Math.random() * 10 - 2, r: 3 + Math.random() * 4, c: cols[i % 4], life: 150});
}
function tick(){
  cx.clearRect(0, 0, W, H);
  parts = parts.filter(p => {
    if(p.life !== undefined){ p.vy += .25; p.x += p.vx; p.y += p.vy; p.life--; cx.fillStyle = p.c; cx.fillRect(p.x, p.y, p.r, p.r * 1.6); return p.life > 0 && p.y < H + 20; }
    p.ph += .02; p.y += p.vy; p.x += Math.sin(p.ph) * .5;
    if(p.y > H + 5){ p.y = -5; p.x = Math.random() * W; }
    cx.fillStyle = "rgba(251,243,224,.75)"; cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, 6.28); cx.fill(); return true;
  });
  requestAnimationFrame(tick);
}
tick();
</script>
</body>
</html>
